server.port=8083
spring.datasource.url=${KANBAN_DB_URL:jdbc:mysql://localhost:3306/kanban}
spring.datasource.username=${KANBAN_DB_USER}
spring.datasource.password=${KANBAN_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

kanban.jwt.secret=${KANBAN_JWT_SECRET}
spring.application.name=Useraurth
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
